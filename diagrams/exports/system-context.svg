<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1100" height="70" fill="#0f172a" />
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="700">System Context Diagram: Compatibility-Based Peer Learning Platform</text>
  <text x="30" y="58" fill="#94a3b8" font-size="13">Diploma Project Architecture Baseline • High-Level System Boundaries &amp; Actor Contexts</text>

  <!-- Outer System Boundary -->
  <rect x="420" y="100" width="650" height="420" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="440" y="130" fill="#1e3a8a" font-size="14" font-weight="700" letter-spacing="1">SYSTEM BOUNDARY: PEER LEARNING PLATFORM</text>

  <!-- Core System Box -->
  <rect x="450" y="150" width="590" height="340" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="150" width="590" height="50" rx="10" fill="#2563eb" />
  <text x="745" y="182" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Compatibility-Based Peer Learning Platform</text>
  <text x="745" y="215" fill="#1e293b" font-size="13" font-weight="600" text-anchor="middle">Modular Monolith Architecture: React Frontend + Express API + PostgreSQL</text>

  <!-- System Features Grid -->
  <rect x="475" y="235" width="260" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="490" y="258" fill="#0f172a" font-size="13" font-weight="700">Topic Communities &amp; Channels</text>
  <text x="490" y="280" fill="#475569" font-size="11">• Structured channel catalog</text>
  <text x="490" y="298" fill="#475569" font-size="11">• Mandatory channel membership gate</text>
  <text x="490" y="316" fill="#475569" font-size="11">• Discussion posts &amp; acknowledgements</text>

  <rect x="755" y="235" width="260" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="770" y="258" fill="#0f172a" font-size="13" font-weight="700">Explainable Compatibility Engine</text>
  <text x="770" y="280" fill="#475569" font-size="11">• Score = 100(0.40T + 0.35G + 0.25L)</text>
  <text x="770" y="298" fill="#475569" font-size="11">• Language &amp; time eligibility gates</text>
  <text x="770" y="316" fill="#475569" font-size="11">• Decomposed human-readable badges</text>

  <rect x="475" y="345" width="260" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="490" y="368" fill="#0f172a" font-size="13" font-weight="700">1-to-1 Session Text Chat</text>
  <text x="490" y="390" fill="#475569" font-size="11">• Dedicated real-time WebSocket room</text>
  <text x="490" y="408" fill="#475569" font-size="11">• Participant-only message isolation</text>
  <text x="490" y="426" fill="#475569" font-size="11">• 60-second disconnection grace timer</text>
  <text x="490" y="444" fill="#475569" font-size="11">• Terminal triggers &amp; idempotent finalization</text>

  <rect x="755" y="345" width="260" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="770" y="368" fill="#0f172a" font-size="13" font-weight="700">Time Accounting &amp; Reputation</text>
  <text x="770" y="390" fill="#475569" font-size="11">• 180-minute daily allowance (Confirmed)</text>
  <text x="770" y="408" fill="#475569" font-size="11">• UTC 00:00–24:00 day boundary split</text>
  <text x="770" y="426" fill="#475569" font-size="11">• Dual-confirmation session outcomes</text>
  <text x="770" y="444" fill="#475569" font-size="11">• 5-min threshold for public reviews</text>

  <!-- Actors Section (Left Side) -->
  <!-- Visitor -->
  <rect x="30" y="110" width="160" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="110" cy="135" r="12" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="165" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Visitor</text>
  <text x="110" y="183" fill="#64748b" font-size="11" text-anchor="middle">Unauthenticated Guest</text>

  <!-- Learner -->
  <rect x="30" y="240" width="160" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="110" cy="270" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="305" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Learner</text>
  <text x="110" y="325" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">Authenticated Student</text>
  <text x="110" y="343" fill="#64748b" font-size="10" text-anchor="middle">University / School / Self</text>

  <!-- Administrator -->
  <rect x="30" y="400" width="160" height="90" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="110" cy="425" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="455" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Administrator</text>
  <text x="110" y="473" fill="#64748b" font-size="11" text-anchor="middle">Platform Moderator</text>

  <!-- Contextual Roles (Middle Column) -->
  <rect x="230" y="215" width="150" height="170" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="305" y="235" fill="#7e22ce" font-size="11" font-weight="700" text-anchor="middle">CONTEXTUAL ROLES</text>
  
  <rect x="240" y="245" width="130" height="35" rx="5" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="305" y="267" fill="#581c87" font-size="11" font-weight="600" text-anchor="middle">Listing Author</text>

  <rect x="240" y="290" width="130" height="35" rx="5" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="305" y="312" fill="#581c87" font-size="11" font-weight="600" text-anchor="middle">Respondent</text>

  <rect x="240" y="335" width="130" height="35" rx="5" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="305" y="357" fill="#581c87" font-size="11" font-weight="600" text-anchor="middle">Study Partner</text>

  <!-- Connectors -->
  <!-- Visitor to System -->
  <path d="M 190 155 L 450 175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="145" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">Browse / Register</text>

  <!-- Learner to Contextual Roles -->
  <path d="M 190 300 L 230 300" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-purple)" />

  <!-- Contextual Roles to System -->
  <path d="M 380 262 L 450 262" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <path d="M 380 307 L 450 307" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <path d="M 380 352 L 450 352" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)" />

  <!-- Admin to System -->
  <path d="M 190 445 L 450 445" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="440" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">Moderate / Communities</text>

  <!-- Formally Excluded Scope (Bottom Banner) -->
  <rect x="30" y="550" width="1040" height="120" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="50" y="578" fill="#9f1239" font-size="14" font-weight="700">FORMALLY EXCLUDED SYSTEM DEPENDENCIES &amp; COMMERCIAL FEATURES</text>
  <text x="50" y="600" fill="#be123c" font-size="12">The platform architecture deliberately isolates peer learning discovery by excluding heavy commercial and infrastructure dependencies:</text>

  <rect x="50" y="615" width="310" height="40" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="65" y="635" fill="#881337" font-size="11" font-weight="700">❌ No Third-Party Video / WebRTC</text>
  <text x="65" y="648" fill="#64748b" font-size="10">Real-time collaboration is strictly text chat</text>

  <rect x="380" y="615" width="310" height="40" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="395" y="635" fill="#881337" font-size="11" font-weight="700">❌ No Payments or Paid Tutoring</text>
  <text x="395" y="648" fill="#64748b" font-size="10">Non-commercial, reciprocal peer study only</text>

  <rect x="710" y="615" width="340" height="40" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="725" y="635" fill="#881337" font-size="11" font-weight="700">❌ No Black-Box Machine Learning</text>
  <text x="725" y="648" fill="#64748b" font-size="10">Deterministic heuristics (T, G, L) with transparent explanations</text>
</svg>
